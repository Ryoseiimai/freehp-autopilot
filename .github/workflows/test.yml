name: test
# コードを変えたときだけ単体テストを流す（鍵は使わない・外部にも出ない）。
on:
  push:
    branches: [main]
    paths: ['autopilot/**', 'tests/**', 'tools/**', 'config.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 単体テスト
        shell: bash
        run: python3 -m unittest discover -s tests -v
