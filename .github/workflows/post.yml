name: post
# 1日8回（日本時間 8:13 10:13 12:13 14:13 16:13 18:13 20:13 21:43）。URL 付きは 12時台か20時台の1本だけ。
on:
  schedule:
    - cron: '13 23,1,3,5,7,9,11 * * *'
    - cron: '43 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1=投稿しない（予定文だけ）/ 0=本番で投稿'
        type: choice
        options: ['1', '0']
        default: '1'
      post_type:
        description: '型を固定して試す（空なら自動）: tip check rewrite law part mihon photo offer'
        type: string
        default: ''
      check_account:
        description: 'X の鍵が @freehp3000 のものかだけ確かめる（投稿しない・読み取り1回分の料金）'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.DRY_RUN || '1' }}
      POST_TYPE: ${{ inputs.post_type }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # 待たされた実行でも最新の状態から始める（イベント時点の古いコミットだと状態ファイルがぶつかる）
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: STOP の確認
        id: guard
        shell: bash
        run: |
          mkdir -p out
          if [ -f STOP ]; then
            echo "STOP ファイルがあるので全ジョブ停止中（何もしません）" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Claude Code CLI（OAuth トークンだけのとき）
        if: steps.guard.outputs.go == 'true' && env.ANTHROPIC_API_KEY == '' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        shell: bash
        run: npm install -g @anthropic-ai/claude-code >/dev/null && claude --version

      - name: X の鍵のアカウント確認（投稿しない）
        if: steps.guard.outputs.go == 'true' && inputs.check_account
        shell: bash
        run: python3 -m autopilot.xapi 2>&1 | tee out/post.log

      - name: 投稿（DRY_RUN=${{ env.DRY_RUN }}）
        if: steps.guard.outputs.go == 'true'
        shell: bash
        run: python3 -m autopilot.post 2>&1 | tee out/post.log

      - name: 状態を保存
        if: steps.guard.outputs.go == 'true'
        shell: bash
        run: |
          scripts/commit_state.sh "post: 記録を追加" state/posts.jsonl

      - name: 失敗を Issue に記録（3回連続なら停止）
        if: failure()
        shell: bash
        run: python3 -m autopilot.failures fail --job post --workflow post.yml --log out/post.log

      - name: 失敗 Issue が開いていれば閉じる
        if: success() && steps.guard.outputs.go == 'true'
        shell: bash
        run: python3 -m autopilot.failures ok --job post
